<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letícia — Links</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0b1120;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    max-width: 400px;
    width: 100%;
    padding: 48px 24px;
    text-align: center;
  }
  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f472b6, #60a5fa);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 900;
    color: #fff;
    margin: 0 auto 16px;
    box-shadow: 0 0 30px rgba(244, 114, 182, 0.3);
  }
  .name {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .bio {
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.5;
    margin-bottom: 32px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 24px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .link-btn:hover {
    transform: translateY(-2px);
  }
  .link-raio {
    background: linear-gradient(135deg, #f472b6, #ec4899);
    color: #fff;
    box-shadow: 0 4px 20px rgba(244, 114, 182, 0.3);
  }
  .link-raio:hover { box-shadow: 0 8px 28px rgba(244, 114, 182, 0.4); }
  .link-wpp {
    background: rgba(74, 222, 128, 0.1);
    border: 1px solid rgba(74, 222, 128, 0.3);
    color: #4ade80;
  }
  .link-wpp:hover { box-shadow: 0 8px 28px rgba(74, 222, 128, 0.2); }
  .footer {
    margin-top: 40px;
    font-size: 11px;
    color: #334155;
  }
</style>
</head>
<body>
<div class="container">
  <div class="avatar">L</div>
  <div class="name">Letícia</div>
  <div class="bio">Construa funcionários digitais que rodam seu negócio por você.</div>
  <div class="links">
    <a href="https://leticiadutrasc-ship-it.github.io/raio-x-digital/" class="link-btn link-raio">Raio-X Digital — Análise Gratuita</a>
    <a href="https://wa.me/5531987010961" class="link-btn link-wpp">WhatsApp</a>
  </div>
  <div class="footer">&copy; 2026 Letícia</div>
</div>
</body>
</html>
